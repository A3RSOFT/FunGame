<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Super Ace Scatter</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    color:gold;
}

#balance,#winbox,#freespinbox{
    font-size:22px;
    margin:10px;
}

.slot{
    width:90px;
    height:90px;
    background:#222;
    border:3px solid gold;
    border-radius:15px;
    font-size:50px;
    display:flex;
    justify-content:center;
    align-items:center;
    animation:none;
}

.scatter{
    width:75px;
    height:75px;
    border-radius:50%;
    background:gold;
    color:black;
    font-size:20px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
    animation:spinScatter 2s linear infinite;
}

@keyframes spinScatter{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

.grid{
    display:grid;
    grid-template-columns:repeat(5,90px);
    gap:8px;
    justify-content:center;
    margin-top:20px;
}

.spinAnim{
    animation:roll 0.15s infinite;
}

@keyframes roll{
    0%{transform:translateY(-10px);}
    100%{transform:translateY(10px);}
}

button{
    margin-top:20px;
    padding:12px 30px;
    font-size:22px;
    border:none;
    border-radius:10px;
    background:gold;
    cursor:pointer;
}

.win{
    animation:flash 0.4s infinite;
}

@keyframes flash{
    0%{border-color:yellow;}
    50%{border-color:red;}
    100%{border-color:yellow;}
}
</style>
</head>

<body>

<h1>🎰 SUPER ACE SCATTER 🎰</h1>

<div id="balance">Coins: 1000</div>
<div id="winbox">Win: 0</div>
<div id="freespinbox">Free Spins: 0</div>

<div class="grid" id="grid"></div>

<button onclick="spin()">SPIN</button>

<script>

const normalSymbols = ["🍒","🍋","🍇","💎","7️⃣","⭐"];
const scatterSymbol = "SCATTER";

let balance = 1000;
let freeSpins = 0;
let spinning = false;

const rows = 5;
const cols = 5;

let board = [];

function randomSymbol(){

    let chance = Math.random();

    if(chance < 0.12){
        return scatterSymbol;
    }

    return normalSymbols[
        Math.floor(Math.random()*normalSymbols.length)
    ];
}

function createBoard(){

    board = [];

    for(let r=0;r<rows;r++){

        let row=[];

        for(let c=0;c<cols;c++){
            row.push(randomSymbol());
        }

        board.push(row);
    }
}

function drawBoard(){

    const grid=document.getElementById("grid");
    grid.innerHTML="";

    for(let r=0;r<rows;r++){

        for(let c=0;c<cols;c++){

            const div=document.createElement("div");
            div.className="slot";

            let value = board[r][c];

            if(value===scatterSymbol){

                div.innerHTML=`<div class="scatter">⭐</div>`;

            }else{
                div.textContent=value;
            }

            div.id=`cell-${r}-${c}`;

            grid.appendChild(div);
        }
    }
}

function updateUI(){

    document.getElementById("balance").innerText=
    "Coins: "+balance;

    document.getElementById("freespinbox").innerText=
    "Free Spins: "+freeSpins;
}

function animateSpin(){

    for(let r=0;r<rows;r++){

        for(let c=0;c<cols;c++){

            document
            .getElementById(`cell-${r}-${c}`)
            .classList.add("spinAnim");
        }
    }
}

function stopAnimate(){

    for(let r=0;r<rows;r++){

        for(let c=0;c<cols;c++){

            document
            .getElementById(`cell-${r}-${c}`)
            .classList.remove("spinAnim");
        }
    }
}

async function spin(){

    if(spinning) return;

    spinning=true;

    let bet=20;

    if(freeSpins<=0){

        if(balance<bet){
            alert("No coins!");
            spinning=false;
            return;
        }

        balance-=bet;

    }else{

        freeSpins--;
    }

    updateUI();

    animateSpin();

    await new Promise(r=>setTimeout(r,1500));

    createBoard();

    drawBoard();

    stopAnimate();

    let totalWin = checkWins();

    document.getElementById("winbox").innerText=
    "Win: "+totalWin;

    balance += totalWin;

    updateUI();

    spinning=false;

    if(freeSpins>0){

        setTimeout(()=>{
            spin();
        },1200);
    }
}

function checkWins(){

    let total=0;
    let combo=1;

    let scatterCount=0;

    for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){

            if(board[r][c]===scatterSymbol){
                scatterCount++;
            }
        }
    }

    // FREE SPINS
    if(scatterCount>=5){

        freeSpins +=15;
        alert("🎁 15 FREE SPINS!");

    }else if(scatterCount>=3){

        freeSpins +=10;
        alert("🎁 10 FREE SPINS!");
    }

    // VERTICAL PAYLINES
    for(let c=0;c<cols;c++){

        let first=board[0][c];

        if(first===scatterSymbol) continue;

        let matched=true;

        let cells=[];

        for(let r=0;r<rows;r++){

            if(board[r][c]!==first){
                matched=false;
            }

            cells.push([r,c]);
        }

        if(matched){

            let win = 100 * combo;

            total += win;

            highlight(cells);

            cascade(cells);

            combo++;

        }
    }

    return total;
}

function highlight(cells){

    cells.forEach(pos=>{

        let el=document.getElementById(
        `cell-${pos[0]}-${pos[1]}`
        );

        el.classList.add("win");

        setTimeout(()=>{
            el.classList.remove("win");
        },1000);
    });
}

function cascade(cells){

    cells.forEach(pos=>{

        board[pos[0]][pos[1]]=
        randomSymbol();
    });

    setTimeout(()=>{
        drawBoard();

        let extra=checkCascade();

        if(extra>0){

            balance+=extra;

            document.getElementById("winbox").innerText=
            "Win Combo: "+extra;

            updateUI();
        }

    },700);
}

function checkCascade(){

    let extra=0;

    for(let c=0;c<cols;c++){

        let first=board[0][c];

        if(first===scatterSymbol) continue;

        let matched=true;

        for(let r=0;r<rows;r++){

            if(board[r][c]!==first){
                matched=false;
            }
        }

        if(matched){

            extra+=200;

            for(let r=0;r<rows;r++){

                board[r][c]=randomSymbol();
            }

            drawBoard();
        }
    }

    return extra;
}

createBoard();
drawBoard();
updateUI();

</script>

</body>
</html>
