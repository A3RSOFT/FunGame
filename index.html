<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Super Ace Mini</title>

<style>

body{
    margin:0;
    background:#111;
    font-family:Arial;
    color:white;
    text-align:center;
}

h1{
    color:gold;
    margin-top:15px;
}

#slot{
    width:370px;
    margin:auto;
    background:#222;
    padding:15px;
    border-radius:20px;
    border:4px solid gold;
    box-shadow:0 0 20px gold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(5,70px);
    gap:5px;
    justify-content:center;
}

.cell{
    width:70px;
    height:70px;
    background:white;
    border-radius:10px;
    font-size:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
    animation:drop 0.3s ease;
}

/* CARD COLORS */
.heart{
    color:red;
    background:#ffeaea;
}

.spade{
    color:black;
    background:#f2f2f2;
}

.diamond{
    color:orange;
    background:#fff0d9;
}

.club{
    color:blue;
    background:#e9f2ff;
}

/* SCATTER */
.scatter{
    background:gold;
    color:white;
    font-weight:bold;
    animation:scatterGlow 1s infinite;
    border:3px solid yellow;
}

/* DROP EFFECT */
@keyframes drop{
    from{
        transform:translateY(-100px);
        opacity:0;
    }

    to{
        transform:translateY(0);
        opacity:1;
    }
}

/* SCATTER GLOW */
@keyframes scatterGlow{

    0%{
        box-shadow:0 0 5px yellow;
        transform:scale(1);
    }

    50%{
        box-shadow:0 0 20px orange;
        transform:scale(1.1);
    }

    100%{
        box-shadow:0 0 5px yellow;
        transform:scale(1);
    }
}

button{
    margin-top:15px;
    padding:15px 40px;
    border:none;
    border-radius:50px;
    background:gold;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

.info{
    margin-top:15px;
    font-size:22px;
}

.win{
    color:lime;
    font-size:28px;
    margin-top:10px;
}

</style>
</head>

<body>

<h1>🎰 SUPER ACE MINI 🎰</h1>

<div id="slot">

<div class="grid" id="grid"></div>

<div class="info">
Balance: <span id="balance">1000</span>
<br>
Bet: <span id="bet">20</span>
</div>

<button onclick="spin()">SPIN</button>

<div class="win" id="result"></div>

</div>

<script>

const normalSymbols = [
    {icon:"♥", class:"heart"},
    {icon:"♠", class:"spade"},
    {icon:"♦", class:"diamond"},
    {icon:"♣", class:"club"},
    {icon:"A", class:"heart"},
    {icon:"K", class:"spade"},
    {icon:"Q", class:"diamond"},
    {icon:"J", class:"club"}
];

const scatterSymbol = {
    icon:"⭕",
    class:"scatter"
};

let balance = 1000;
let bet = 20;

let freeSpins = 0;

const rows = 4;
const cols = 5;

const grid = document.getElementById("grid");

function randomSymbol(){

    let chance = Math.random();

    // scatter chance
    if(chance < 0.10){
        return scatterSymbol;
    }

    return normalSymbols[
        Math.floor(Math.random()*normalSymbols.length)
    ];
}

function createBoard(){

    let board = [];

    for(let r=0;r<rows;r++){

        let row = [];

        for(let c=0;c<cols;c++){

            row.push(randomSymbol());
        }

        board.push(row);
    }

    return board;
}

function renderBoard(board){

    grid.innerHTML = "";

    for(let r=0;r<rows;r++){

        for(let c=0;c<cols;c++){

            let s = board[r][c];

            const div = document.createElement("div");

            div.className = "cell " + s.class;

            div.style.animationDelay =
                ((r*cols+c)*0.05)+"s";

            div.innerHTML = s.icon;

            grid.appendChild(div);
        }
    }
}

function spin(){

    if(freeSpins <= 0){

        if(balance < bet){
            alert("No balance");
            return;
        }

        balance -= bet;
    }

    if(freeSpins > 0){

        freeSpins--;

        document.getElementById("result").innerHTML =
            "🎁 FREE SPIN LEFT: " + freeSpins;
    }

    updateInfo();

    let spins = 0;

    const rolling = setInterval(()=>{

        renderBoard(createBoard());

        spins++;

        if(spins > 15){

            clearInterval(rolling);

            finalSpin();
        }

    },100);
}

function finalSpin(){

    let board = createBoard();

    renderBoard(board);

    setTimeout(()=>{

        checkWins(board,1);

    },500);
}

function checkWins(board,combo){

    let matched = [];

    let totalWin = 0;

    let scatterCount = 0;

    // count scatter
    for(let r=0;r<rows;r++){

        for(let c=0;c<cols;c++){

            if(board[r][c].class=="scatter"){
                scatterCount++;
            }
        }
    }

    // FREE SPINS
    if(scatterCount >= 5){

        freeSpins += 15;

        document.getElementById("result").innerHTML =
            "🔥 15 FREE SPINS!";
    }

    else if(scatterCount >= 3){

        freeSpins += 10;

        document.getElementById("result").innerHTML =
            "🎁 10 FREE SPINS!";
    }

    // CHECK VERTICAL SAME CARDS
    for(let c=0;c<cols;c++){

        let first = board[0][c].icon;

        let count = 1;

        let temp = [[0,c]];

        for(let r=1;r<rows;r++){

            if(board[r][c].icon == first){

                count++;

                temp.push([r,c]);

            }else{

                break;
            }
        }

        // need at least 3 same vertically
        if(count >= 3){

            matched.push(...temp);

            totalWin += bet * count * combo;
        }
    }

    if(totalWin <= 0){

        updateInfo();

        if(freeSpins <= 0){

            document.getElementById("result").innerHTML =
                "😢 Lose";
        }

        return;
    }

    balance += totalWin;

    document.getElementById("result").innerHTML =
        "🔥 COMBO x" + combo +
        " WIN +" + totalWin;

    updateInfo();

    // REMOVE MATCHED
    matched.forEach(pos=>{

        let r = pos[0];
        let c = pos[1];

        board[r][c] = null;
    });

    // FALL DOWN
    for(let c=0;c<cols;c++){

        let column = [];

        for(let r=rows-1;r>=0;r--){

            if(board[r][c] != null){

                column.push(board[r][c]);
            }
        }

        while(column.length < rows){

            column.push(randomSymbol());
        }

        for(let r=rows-1,i=0;r>=0;r--,i++){

            board[r][c] = column[i];
        }
    }

    renderBoard(board);

    // COMBO CONTINUE
    if(combo < 5){

        setTimeout(()=>{

            checkWins(board,combo+1);

        },700);
    }
}

function updateInfo(){

    document.getElementById("balance").innerHTML =
        balance;

    document.getElementById("bet").innerHTML =
        bet;
}

// START
renderBoard(createBoard());

</script>

    

</body>
</html>
