
<!DOCTYPE html>
<html>
<head>
    <title>Super Ace Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">

    <h1 class="title">SUPER ACE</h1>

    <div class="topbar">
        <span id="multi">x1</span>
    </div>

    <div class="board" id="board"></div>

    <div class="info">
        <div>Balance: <span id="balance">1000</span></div>
        <div>Bet: <span id="betText">10</span></div>
    </div>

    <div class="controls">

        <button onclick="minusBet()">-</button>

        <button class="spin" onclick="spin()">
            SPIN
        </button>

        <button onclick="plusBet()">+</button>

    </div>

    <div class="message" id="message"></div>

</div>

<script src="app.js"></script>
</body>
</html>
