<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Super Ace Mini</title>

<style>

body{
    margin:0;
    background:#111;
    font-family:Arial;
    color:white;
    text-align:center;
}

h1{
    color:gold;
    margin-top:15px;
}

#slot{
    width:370px;
    margin:auto;
    background:#222;
    padding:15px;
    border-radius:20px;
    border:4px solid gold;
    box-shadow:0 0 20px gold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(5,70px);
    gap:5px;
    justify-content:center;
}

.cell{
    width:70px;
    height:70px;
    background:white;
    border-radius:10px;
    font-size:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
    animation:drop 0.3s ease;
}

/* CARD COLORS */
.heart{
    color:red;
    background:#ffeaea;
}

.spade{
    color:black;
    background:#f2f2f2;
}

.diamond{
    color:orange;
    background:#fff0d9;
}

.club{
    color:blue;
    background:#e9f2ff;
}

/* SCATTER */
.scatter{
    background:gold;
    color:white;
    font-weight:bold;
    animation:scatterGlow 1s infinite;
    border:3px solid yellow;
}

/* DROP EFFECT */
@keyframes drop{
    from{
        transform:translateY(-100px);
        opacity:0;
    }

    to{
        transform:translateY(0);
        opacity:1;
    }
}

/* SCATTER GLOW */
@keyframes scatterGlow{

    0%{
        box-shadow:0 0 5px yellow;
        transform:scale(1);
    }

    50%{
        box-shadow:0 0 20px orange;
        transform:scale(1.1);
    }

    100%{
        box-shadow:0 0 5px yellow;
        transform:scale(1);
    }
}

button{
    margin-top:15px;
    padding:15px 40px;
    border:none;
    border-radius:50px;
    background:gold;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

.info{
    margin-top:15px;
    font-size:22px;
}

.win{
    color:lime;
    font-size:28px;
    margin-top:10px;
}

</style>
</head>

<body>

<h1>🎰 SUPER ACE MINI 🎰</h1>

<div id="slot">

<div class="grid" id="grid"></div>

<div class="info">
Balance: <span id="balance">1000</span>
<br>
Bet: <span id="bet">20</span>
</div>

<button onclick="spin()">SPIN</button>

<div class="win" id="result"></div>

</div>

<script>

const symbols = [
    {icon:"♥", class:"heart"},
    {icon:"♠", class:"spade"},
    {icon:"♦", class:"diamond"},
    {icon:"♣", class:"club"},
    {icon:"🪙", class:"scatter"}
];

let balance = 1000;
let bet = 20;

const grid = document.getElementById("grid");

function randomSymbol(){
    return symbols[Math.floor(Math.random()*symbols.length)];
}

function renderBoard(board){

    grid.innerHTML = "";

    board.forEach((s,index)=>{

        const div = document.createElement("div");

        div.className = "cell " + s.class;

        div.style.animationDelay = (index*0.05)+"s";

        div.innerHTML = s.icon;

        if(s.class=="scatter"){
            div.innerHTML = "💰";
        }

        grid.appendChild(div);

    });
}

function spin(){

    if(balance < bet){
        alert("No balance!");
        return;
    }

    balance -= bet;

    document.getElementById("balance").innerText = balance;

    document.getElementById("result").innerText = "";

    let spins = 0;

    const rolling = setInterval(()=>{

        let temp = [];

        for(let i=0;i<20;i++){
            temp.push(randomSymbol());
        }

        renderBoard(temp);

        spins++;

        if(spins > 15){

            clearInterval(rolling);

            finalSpin();

        }

    },100);

}

function finalSpin(){

    let board = [];

    let scatterCount = 0;

    for(let i=0;i<20;i++){

        let s = randomSymbol();

        board.push(s);

        if(s.class=="scatter"){
            scatterCount++;
        }
    }

    renderBoard(board);

    let win = 0;

    if(scatterCount >= 3){

        win = bet * 5;

        document.getElementById("result").innerText =
            "🎉 SCATTER BONUS WIN! +" + win;

    }else{

        document.getElementById("result").innerText =
            "Try Again";

    }

    balance += win;

    document.getElementById("balance").innerText = balance;

}

let startBoard = [];

for(let i=0;i<20;i++){
    startBoard.push(randomSymbol());
}

renderBoard(startBoard);

</script>

</body>
</html>
